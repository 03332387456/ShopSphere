<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful</title>

<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/256/8847/8847360.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/successPage.css">
</head>

<body>

    <!-- header section start -->
    <header>
        <nav class="nav py-2 d-flex justify-content-center align-items-center">
            <div class="logo"> <span><i class="fa-solid fa-cart-shopping"></i></span> <span class="shop">SHOP
                    SPHERE</span> </div>
        </nav>
    </header>
    <!-- header section end -->


    <!-- Success Section -->
    <section class="container my-5">

        <div class="card shadow-lg p-4">

            <!-- Success Icon -->
            <div class="text-center mb-4">
                <i class="fa-solid fa-circle-check text-success display-1"></i>
                <h2 class="mt-3 fw-bold">Order Placed Successfully!</h2>
                <p class="text-muted">
                    Thank you for shopping with ShopSphere.
                </p>
            </div>

            <hr>


            <!-- Order Details -->
            <div id="orderDetails">

                <!-- <div class="d-flex justify-content-between mb-2">
                    <span>Order ID</span>
                    <strong id="orderId">#SP1001</strong>
                </div> -->



            </div>


            <!-- Ordered Products -->
            <h5 class="fw-bold mb-3">Ordered Products</h5>

            <!-- Product Cards section start -->
            <section class="">
               
                <div class="row g-4 justify-content-center" id="productsCard">

                    <!-- Card 1 -->
                    <div class="col-12 col-sm-6 col-md-4 col-lg-3 ">
                        <div class="product-card h-100 p-3 border border-dark rounded">
                            <div class="img-wrapper border p-1 mb-3">
                                <img src="https://m.media-amazon.com/images/I/51Lko54--JL._AC_SL1080_.jpg" alt="Laptop"
                                    class="img-fluid">
                            </div>
                            <p class="name fw-bold mb-1">Name: Laptop</p>
                            <p class="categoryOfProduct text-muted small mb-1">Category: <span>Electronics</span></p>
                            <p class="price mb-1">Price: <span class="fw-bold text-primary">125,000</span></p>
                            <p class="ratings mb-1">Ratings: <span class="badge bg-warning text-dark">4.6 <i
                                        class="fa-solid fa-star"></i></span></p>
                            <p class="stock mb-3">Stock Status: <span class="text-success fw-semibold">Product
                                    Available</span></p>
                        </div>
                    </div>

                </div>
            </section>
            <!-- Product Cards section End -->

            <hr>

            <!-- Buttons -->
            <div class="d-flex gap-3 justify-content-center mt-3">

                <a href="./index.html" class="btn btn-primary">
                    Continue Shopping
                </a>

               
            </div>

        </div>

    </section>

    <script src="./js/storage.js"></script>
    <script type="module" src="./js/successPage.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://kit.fontawesome.com/5055fbe446.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
