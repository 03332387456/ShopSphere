<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CheckOut - </title>
    
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/256/8847/8847360.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/checkOut.css">
</head>

<body>

    <!-- header section start -->
    <header>
        <nav class="nav py-2 d-flex justify-content-center align-items-center">
            <div class="logo"> <span><i class="fa-solid fa-cart-shopping"></i></span> <span class="shop">SHOP
            SPHERE</span> </div>
        </nav>
    </header> <!-- header section end -->

    <div class="container my-5">

        <h2 class="text-center fw-bold mb-5">
            Checkout
        </h2>

        <div class="row g-5">

            <!-- LEFT SIDE -->
            <div class="col-lg-7">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-4">
                        Customer Information
                    </h4>

                    <form id="checkoutForm">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">
                                    Full Name
                                </label>
                                <input type="text" class="form-control" id="fullName">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">
                                    Email
                                </label>
                                <input type="email" class="form-control" id="email">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Phone Number
                            </label>
                            <input type="number" class="form-control" id="phone">
                        </div>

                        <hr class="my-4">

                        <h5 class="mb-3">
                            Shipping Details
                        </h5>

                        <div class="mb-3">
                            <label class="form-label">
                                Address
                            </label>
                            <input type="text" class="form-control" id="address">
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">
                                    City
                                </label>
                                <input type="text" class="form-control" id="city">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">
                                    Postal Code
                                </label>
                                <input type="number" class="form-control" id="postalCode">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Country
                            </label>
                            <input type="text" class="form-control" id="country">
                        </div>

                        <hr>

                        <h5 class="mb-3">
                            Payment Method
                        </h5>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="payment" id="cashMethod" checked>
                            <label class="form-check-label" for="cashMethod">
                                Cash On Delivery
                            </label>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="radio" name="payment" id="cardMethod">
                            <label class="form-check-label" for="cardMethod">
                                Credit / Debit Card
                            </label>
                        </div>

                    </form>

                </div>

            </div>


            <!-- RIGHT SIDE -->
            <div class="col-lg-5">

                <div class="card shadow-sm p-4">

                    <h4 class="mb-4">
                        Order Summary
                    </h4>

                    <!-- checkout products start -->
                    <div id="checkoutProducts">
                    <h5 id="ProductInformation" class="mb-4">
                        Product Information
                    </h5>
                        <div id="infoOfProduct">
                          <p>Name : Laptop</p>
                          <p>Quantity : 12</p>
                          <p>Price : 12000</p>
                          <hr>
                        </div>
                    </div>
                    <!-- checkout products end -->


                    <!-- summary table start -->
                    <div id="summaryTable">

                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal</span>
                            <strong>$0</strong>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>GST</span>
                            <strong>$0</strong>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Discount</span>
                            <strong>$0</strong>
                        </div>

                        <div class="d-flex justify-content-between mb-3">
                            <span>Shipping</span>
                            <strong>$0</strong>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-4">
                            <h5>Grand Total</h5>
                            <h5 class="text-success">
                                $0
                            </h5>
                        </div>

                    </div>
                    <!-- summary end start -->


                    <button class="btn btn-primary w-100 mb-3" id="placeOrderBtn">
                        Place Order
                    </button>

                    <a href="./index.html" class="btn btn-outline-secondary w-100">
                        Continue Shopping
                    </a>
                </div>

            </div>

        </div>

    </div>


    <script src="./js/storage.js"></script>
    <script type="module" src="./js/checkOut.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://kit.fontawesome.com/5055fbe446.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
